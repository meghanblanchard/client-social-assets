<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex, nofollow"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Artisan Social Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap">
<style>
/* Layout: phone-width column. One hero post in full, then earlier posts as compact expandable rows. */
:root{
  --paper:#F3F3F0;
  --card:#FFFFFF;
  --ink:#161616;
  --muted:#6B6B66;
  --line:#DEDED8;
  --green:#2A6932;
  --green-ink:#FAFAF7;
  --green-soft:#EDF3EE;
  --display:'Poppins',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#121311; --card:#1B1D1A; --ink:#F0F0EC; --muted:#9C9C95;
    --line:#2E312C; --green:#5FA368; --green-ink:#0E1710; --green-soft:#1E2A20;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#121311; --card:#1B1D1A; --ink:#F0F0EC; --muted:#9C9C95;
  --line:#2E312C; --green:#5FA368; --green-ink:#0E1710; --green-soft:#1E2A20;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--display);font-size:16px;line-height:1.55;margin:0}
.wrap{max-width:540px;margin:0 auto;padding-inline:20px;padding-block:28px 56px}

header{display:flex;flex-direction:column;gap:18px;margin-bottom:24px}
.logo{width:150px;height:auto}
.logo-dark{display:none}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) .logo-light{display:none}
  :root:not([data-theme="light"]) .logo-dark{display:block}
}
:root[data-theme="dark"] .logo-light{display:none}
:root[data-theme="dark"] .logo-dark{display:block}
h1{font-size:1.6rem;line-height:1.2;font-weight:700;margin:0;letter-spacing:-.015em;text-wrap:balance}
.sub{color:var(--muted);font-size:.95rem;margin:6px 0 0}

.eyebrow{
  display:inline-block;background:var(--green);color:var(--green-ink);
  font-size:.66rem;font-weight:600;letter-spacing:.18em;text-transform:uppercase;
  padding:7px 16px;border-radius:999px;
}
.section-label{
  font-size:.68rem;font-weight:600;letter-spacing:.16em;text-transform:uppercase;
  color:var(--muted);margin:42px 0 12px;
}

.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-top:14px}
.card img{display:block;width:100%;max-width:100%;height:auto}
.card-body{padding:20px;display:flex;flex-direction:column;gap:16px}
.card-body h2{font-size:1.22rem;font-weight:600;margin:0 0 6px;letter-spacing:-.01em;text-wrap:balance}
.card-body .blurb{margin:0;color:var(--muted);font-size:.95rem}

.btnrow{display:flex;flex-direction:column;gap:9px}
.btn{
  display:block;text-align:center;text-decoration:none;
  background:var(--green);color:var(--green-ink);font-weight:600;font-size:.95rem;
  padding:14px 18px;border-radius:999px;
}
.btn.small{padding:11px 16px;font-size:.88rem}
.btn:focus-visible{outline:3px solid var(--green);outline-offset:3px}
.btn.off{background:transparent;color:var(--muted);border:1px dashed var(--line);pointer-events:none;font-weight:500}

.how{margin-top:10px;display:flex;flex-direction:column;gap:12px}
.how p{margin:0;font-size:.9rem;color:var(--muted)}
.how p strong{color:var(--ink);font-weight:600}

.lines{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.lines li{background:var(--green-soft);border:1px solid var(--line);border-radius:11px;padding:13px 15px;display:flex;gap:12px;align-items:flex-start}
.lines q{flex:1;min-width:0;font-size:.92rem;quotes:none}
.copy{
  flex:none;background:transparent;border:1px solid var(--line);color:var(--muted);
  font-family:inherit;font-size:.7rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
  padding:6px 11px;border-radius:999px;cursor:pointer;
}
.copy:hover{color:var(--ink);border-color:var(--muted)}
.copy:focus-visible{outline:2px solid var(--green);outline-offset:2px}
.copy[data-done="1"]{color:var(--green);border-color:var(--green)}
.lines-label{font-size:.82rem;color:var(--muted);margin:0 0 -4px}

details.row{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:9px;overflow:hidden}
details.row summary{
  list-style:none;cursor:pointer;padding:11px;display:flex;gap:13px;align-items:center;
}
details.row summary::-webkit-details-marker{display:none}
details.row summary:focus-visible{outline:2px solid var(--green);outline-offset:-2px}
.thumb{flex:none;width:86px;aspect-ratio:16/9;max-width:100%;border-radius:7px;object-fit:cover;display:block}
.rowtext{flex:1;min-width:0}
.rowtext b{display:block;font-size:.95rem;font-weight:600;line-height:1.3}
.rowtext span{font-size:.8rem;color:var(--muted)}
.chev{flex:none;color:var(--green);font-size:.72rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase}
details.row .c-open{display:none}
details.row[open] .c-closed{display:none}
details.row[open] .c-open{display:inline;color:var(--muted)}
.rowbody{padding:0 14px 16px;display:flex;flex-direction:column;gap:12px}

.note{font-size:.86rem;color:var(--muted);border-left:3px solid var(--green);padding-left:13px;margin:0}
.empty{border:1px dashed var(--line);border-radius:12px;padding:20px;color:var(--muted);font-size:.9rem;margin:0}

footer{margin-top:48px;padding-top:20px;border-top:1px solid var(--line);font-size:.82rem;color:var(--muted)}
footer p{margin:0 0 6px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="wrap">
  <header>
    <img class="logo logo-light" src="img/logo.png" alt="Artisan Dental Laboratory">
    <img class="logo logo-dark" src="img/logo-white.png" alt="Artisan Dental Laboratory">
    <div>
      <h1>What we're posting</h1>
      <p class="sub">Every share puts our work in front of people who should see it. Takes about a minute.</p>
    </div>
  </header>

  <span class="eyebrow">Up now</span>
  <div id="hero"></div>

  <div class="section-label">More to share</div>
  <div id="archive"></div>

  <footer>
    <p>This page updates every time a new post goes live. Check back.</p>
    <p id="updated"></p>
  </footer>
</div>

<script>
/* ---- The only block that changes between updates. Newest first. ---- */
var UPDATED = "19 October 2026";

/* live: false keeps a post off the page until it is published. */
var POSTS = [
  {
    live: true,
    title: "29th Annual Golf Tournament & Fundraiser",
    blurb: "Photos, winners and sponsors from the 29th Annual Golf Tournament & Fundraiser, which funds the Terry Monetti Memorial Scholarship at OHSU.",
    img: "img/post-golf.jpg",
    posted: "19 October",
    fb: "https://www.facebook.com/permalink.php?story_fbid=1434876528768349&id=100067380452806",
    li: "https://www.linkedin.com/feed/update/urn:li:activity:7518015649751937024/",
    ig: "https://www.instagram.com/p/Der58R-gdlx/",
    lines: [
      "Thank you to every golfer and sponsor who came out this year!",
      "This tournament funds a scholarship for an OHSU dental student every year. Love that.",
      "29 years and still going.",
      "Congrats to the winners! Team photos are up at artisandentalgolf.com."
    ],
    comments: [
      "Great photos!",
      "Thank you, sponsors!",
      "Congrats to the winners!"
    ]
  },
  {
    live: true,
    title: "Record turnout at the OHSU ASDA Vendor Fair",
    blurb: "Greg, Anna and Jeffery at the OHSU ASDA Vendor Fair, which had a record turnout of dental students.",
    img: "img/post-vendorfair.jpg",
    posted: "14 October",
    fb: "https://www.facebook.com/permalink.php?story_fbid=pfbid04rKD7Q7FoUeVR45gKangqopyhQa4t98ycdFwKsjtc18jVXH5nfcDYaEzwSDmh9dKl&id=100067380452806",
    li: "https://www.linkedin.com/feed/update/urn:li:activity:7516296191995822081/",
    ig: "https://www.instagram.com/artisandentallab/p/DefrONTD3mC/",
    lines: [
      "Shoutout to Greg, Anna and Jeffery for repping us at OHSU!",
      "Love that we get to meet dental students this early.",
      "Proud of these three 👏",
      "Looks like it was a packed night. Congrats to the raffle winners!"
    ],
    comments: [
      "Great job, you three!",
      "Love seeing our team out there!",
      "Congrats to the raffle winners!"
    ]
  },
  {
    live: false,
    title: "Fifty years at the bench",
    blurb: "Beverly Olivier on almost fifty years of denture work, why the digital denture holds the same quality, and the people coming up behind her.",
    img: "img/post-beverly.jpg",
    posted: "",
    fb: "", li: "",
    lines: [
      "We changed how we make dentures this year. Here's a look at it from the people actually doing the work.",
      "Beverly has been at our bench for almost fifty years. Worth two minutes of your time.",
      "If you've wondered what digital dentures look like inside a production lab, this is a good couple of minutes.",
      "Proud of this team."
    ],
    comments: [
      "Beverly trained half of us.",
      "Great to see the lab on camera.",
      "Fifty years is no joke."
    ]
  },
  {
    live: false,
    title: "Forty arches a day, one finisher",
    blurb: "Susan on what surprised her: the finishing step is simple enough that one trained person keeps up with the mill.",
    img: "img/post-capacity.jpg",
    posted: "",
    fb: "", li: "",
    lines: [
      "About ten minutes an arch. That number surprised us too.",
      "One trained finisher keeps up with the mill. Worth a watch.",
      "This is the part people don't expect about digital dentures.",
      "Proud of our finishing crew."
    ],
    comments: [
      "Ten minutes an arch is no joke.",
      "Our finishing crew is good.",
      "That number surprised me too."
    ]
  },
  {
    live: false,
    title: "Monolithic",
    blurb: "Two dentists on what actually changes with a milled denture, and why one solid piece means less to break.",
    img: "img/post-monolithic.jpg",
    posted: "",
    fb: "", li: "",
    lines: [
      "Two dentists on why a milled denture holds up better. Short watch.",
      "One solid piece instead of teeth set into a base.",
      "Good to hear what this looks like from the clinical side.",
      "Worth two minutes if you work with removables."
    ],
    comments: [
      "One solid piece makes the difference.",
      "Good to hear it from the clinical side.",
      "This is the question every doctor asks us."
    ]
  }
];
/* ---- end of the editable block ---- */

function el(tag, cls, text){
  var n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;
  return n;
}

function linkBtn(href, label, small){
  var a = el("a", "btn" + (small ? " small" : ""));
  if (href) {
    a.href = href; a.target = "_blank"; a.rel = "noopener";
    a.textContent = label;
  } else {
    a.href = "#"; a.className += " off";
    a.setAttribute("aria-disabled", "true");
    a.textContent = label.replace("Open on ", "") + " link coming soon";
  }
  return a;
}

function lineList(items, label){
  var box = el("div");
  box.style.display = "flex";
  box.style.flexDirection = "column";
  box.style.gap = "8px";
  if (label) box.appendChild(el("p", "lines-label", label));
  var ul = el("ul", "lines");
  items.forEach(function(t){
    var li = el("li");
    var q = el("q", null, t);
    var b = el("button", "copy", "Copy");
    b.type = "button";
    li.appendChild(q); li.appendChild(b);
    ul.appendChild(li);
  });
  box.appendChild(ul);
  return box;
}

function howTo(){
  var d = el("div", "how");
  var p1 = el("p");
  p1.innerHTML = "<strong>Facebook:</strong> tap Share, then Share to News Feed. Nothing to write.";
  var p2 = el("p");
  p2.innerHTML = "<strong>LinkedIn:</strong> tap Repost, then pick Repost with your thoughts rather than the plain repost. Adding a line of your own is what puts it in front of people who know you.";
  var p3 = el("p");
  p3.innerHTML = "<strong>Instagram:</strong> like it and leave a comment. Both help it reach more people.";
  d.appendChild(p1); d.appendChild(p3); d.appendChild(p2);
  return d;
}

function renderHero(p){
  var card = el("div", "card");
  var img = el("img");
  img.src = p.img; img.alt = "Cover image for " + p.title;
  card.appendChild(img);

  var body = el("div", "card-body");
  var head = el("div");
  head.appendChild(el("h2", null, p.title));
  head.appendChild(el("p", "blurb", p.blurb));
  body.appendChild(head);

  var row = el("div", "btnrow");
  row.appendChild(linkBtn(p.fb, "Open on Facebook"));
  if (p.ig) row.appendChild(linkBtn(p.ig, "Open on Instagram"));
  row.appendChild(linkBtn(p.li, "Open on LinkedIn"));
  body.appendChild(row);
  body.appendChild(howTo());

  if (p.lines && p.lines.length) {
    body.appendChild(lineList(p.lines, "Use one of these for LinkedIn, or write your own:"));
  }
  if (p.comments && p.comments.length) {
    body.appendChild(lineList(p.comments, "A comment helps just as much:"));
  }

  card.appendChild(body);
  return card;
}

function renderRow(p){
  var d = el("details", "row");
  var s = el("summary");
  var t = el("img", "thumb");
  t.src = p.img; t.alt = "";
  var txt = el("div", "rowtext");
  txt.appendChild(el("b", null, p.title));
  txt.appendChild(el("span", null, p.posted ? "Posted " + p.posted : "Not live yet"));
  var chev = el("span", "chev");
  chev.appendChild(el("span", "c-closed", "Share"));
  chev.appendChild(el("span", "c-open", "Close"));
  s.appendChild(t); s.appendChild(txt); s.appendChild(chev);
  d.appendChild(s);

  var body = el("div", "rowbody");
  var row = el("div", "btnrow");
  row.appendChild(linkBtn(p.fb, "Facebook", true));
  if (p.ig) row.appendChild(linkBtn(p.ig, "Instagram", true));
  row.appendChild(linkBtn(p.li, "LinkedIn", true));
  body.appendChild(row);
  if (p.lines && p.lines.length) body.appendChild(lineList(p.lines, "Use one of these for LinkedIn, or write your own:"));
  if (p.comments && p.comments.length) body.appendChild(lineList(p.comments, "A comment helps just as much:"));
  d.appendChild(body);
  return d;
}

(function(){
  var hero = document.getElementById("hero");
  var archive = document.getElementById("archive");
  var live = POSTS.filter(function(p){ return p.live !== false; });

  if (!live.length) {
    hero.appendChild(el("p", "empty", "Nothing posted yet. The first one will show up here."));
  } else {
    hero.appendChild(renderHero(live[0]));
  }

  var rest = live.slice(1);
  if (!rest.length) {
    archive.appendChild(el("p", "empty", "Earlier posts will show up here, so you can always go back and share one."));
  } else {
    rest.forEach(function(p){ archive.appendChild(renderRow(p)); });
  }

  document.getElementById("updated").textContent = "Last updated " + UPDATED;

  document.addEventListener("click", function(e){
    var btn = e.target.closest(".copy");
    if (!btn) return;
    var q = btn.parentElement.querySelector("q");
    var text = q.textContent.trim();
    var done = function(){
      btn.textContent = "Copied"; btn.setAttribute("data-done", "1");
      setTimeout(function(){ btn.textContent = "Copy"; btn.removeAttribute("data-done"); }, 1800);
    };
    var fallback = function(){
      var r = document.createRange(); r.selectNodeContents(q);
      var sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(r);
      btn.textContent = "Selected";
      setTimeout(function(){ btn.textContent = "Copy"; }, 1800);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done).catch(fallback);
    } else { fallback(); }
  });
})();
</script>

</body></html>
